version: '3.8'
services:
  mongo:
    image: mongo:latest
    command: --replSet rs0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=mongodb://mongo:27017/sea-connect
    depends_on:
      - mongo
volumes:
  mongo-data:
