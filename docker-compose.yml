version: '3.9'

services:
  mongo_db:
    container_name: db_container
    image: mongo:latest
    command: --replSet rs0
    restart: always
    ports:
      - 2717:27017
    volumes:
      - mongo_db:/data/db
  
  api:
    build: .
    ports:
      - 3002:3002
    environment:
      SERVER_PORT: "3002"
      DATABASE_URL: "mongodb://mongo_db:27017/sea-connect"
    # volumes:
    #   - .:/usr/src/app
    # #   - node_modules_volume:/usr/src/app/node_modules
    depends_on:
      - mongo_db

volumes:
  mongo_db: {}
  node_modules_volume:

    

